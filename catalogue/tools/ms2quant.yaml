id: ms2quant
name: MS2Quant
kind: model
description: MS2Quant is a machine learning-based tool for estimating concentrations of unidentified small
  molecules detected in non-target LC-HRMS analysis. It predicts electrospray ionization efficiency from
  molecular structural fingerprints, which can be obtained directly from MS2 spectra using SIRIUS+CSI:FingerID.
  These predictions are converted into instrument-specific response factors using experimentally measured
  calibrants, enabling concentration estimation without requiring unequivocal chemical identification.
