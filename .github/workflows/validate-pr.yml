# Validates every pull request (including manual edits from forks).
name: Validate catalogue

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --no-project --with-requirements requirements.txt python scripts/build.py --check
      - run: uv run --no-project --with-requirements requirements.txt pytest -q tests
