name: Offer a dataset
description: Describe a dataset you can share for model development or validation.
title: "[Dataset] "
labels: [submission]
body:
  - type: markdown
    attributes:
      value: |
        Fill in the YAML below (or use the form on the tool map website, which fills it for you).
        A bot validates your submission and opens a pull request; a curator reviews it before it goes live.
        All submissions and discussions are public and kept in the history of this repository.
  - type: dropdown
    id: entry_type
    attributes:
      label: Entry type
      options: [Tool, Research question, Dataset, Publication]
      default: 2
    validations:
      required: true
  - type: dropdown
    id: change
    attributes:
      label: Change
      options: [New entry, Edit existing entry]
      default: 0
    validations:
      required: true
  - type: textarea
    id: entry_yaml
    attributes:
      label: Entry (YAML)
      description: One entry. Field definitions are in the schema/ folder, allowed values in vocab.yaml.
      render: yaml
      value: |
        id: my-dataset
        name: My dataset
        description: What was measured, where and when.
        data_type: [hrms_data]       # see vocab.yaml input_data
        matrices: [surface_water]
        endpoints: []
        size: e.g. 500 samples, 2,000 annotated features
        labels: e.g. confirmed identifications (level 1-2)
        access: on_request           # open | on_request | restricted
    validations:
      required: true
  - type: input
    id: on_behalf_of
    attributes:
      label: On behalf of
      description: Optional – if you submit for someone without a GitHub account (name, affiliation).
  - type: checkboxes
    id: consent
    attributes:
      label: Consent
      options:
        - label: I agree that this information is published, and anyone named as contact has agreed to be listed.
          required: true
