<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NORMAN Data Science Tool Map</title>
  <meta name="description" content="Catalogue and map of data science and AI tools for monitoring emerging environmental substances, maintained by the NORMAN Data Science working group.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect x=%224%22 y=%224%22 width=%2210%22 height=%2210%22 rx=%222%22 fill=%22%232a78d6%22/%3E%3Ccircle cx=%2223%22 cy=%2223%22 r=%225%22 fill=%22%23eb6834%22/%3E%3Cpath d=%22M14 14L19 19%22 stroke=%22%2352514e%22 stroke-width=%222%22/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.34.3/cytoscape.min.js"
          integrity="sha512-SQebVa91Tn1DeP45Wo74monK/I9wiQg59uKc7P8vp3T7KQ9l5e8IMjZ1GJTgZehUVQt7eS61DTqldQUb1EHfnw=="
          crossorigin="anonymous" referrerpolicy="no-referrer" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.1/js-yaml.min.js"
          integrity="sha512-Ccva9tZjPfyRDMMosATBaEnAKvX+eBbDfHMnr+0LhTa+NMqKRxUAoDGPotb8biwzQ6xnf4IYuDaPiXw10DYaNA=="
          crossorigin="anonymous" referrerpolicy="no-referrer" defer></script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>NORMAN Data Science Tool Map</h1>
      <p class="subtitle" id="subtitle">Loading…</p>
    </div>
    <div class="actions">
      <button class="btn primary" id="btn-propose" type="button">+ Propose</button>
      <button class="btn" id="btn-help" type="button">How to contribute</button>
      <button class="btn icon" id="btn-theme" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">◐</button>
    </div>
  </header>

  <nav class="tabs" role="tablist" aria-label="Views">
    <a role="tab" href="#/catalogue" data-view="catalogue">Catalogue</a>
    <a role="tab" href="#/matrix" data-view="matrix">Questions × tools</a>
    <a role="tab" href="#/network" data-view="network">Network</a>
    <a role="tab" href="#/roadmap" data-view="roadmap">Roadmap &amp; gaps</a>
  </nav>

  <section class="filters" id="filters" aria-label="Filters">
    <label class="search"><span class="sr-only">Search</span>
      <input type="search" id="f-search" placeholder="Search tools, questions, authors…" autocomplete="off">
    </label>
    <label><span>Endpoint</span><select id="f-endpoint"><option value="">All</option></select></label>
    <label><span>Kind</span><select id="f-kind"><option value="">All</option></select></label>
    <label><span>Maturity</span><select id="f-maturity"><option value="">All</option></select></label>
    <label><span>Verification</span><select id="f-verification"><option value="">All</option></select></label>
    <button class="btn link" id="f-reset" type="button">Reset</button>
  </section>

  <main id="view" tabindex="-1"></main>

  <aside class="panel" id="panel" aria-label="Details" hidden>
    <button class="btn icon close" id="panel-close" type="button" aria-label="Close details">✕</button>
    <div id="panel-body"></div>
  </aside>

  <dialog id="dlg">
    <form method="dialog" class="dlg-close"><button class="btn icon" aria-label="Close">✕</button></form>
    <div id="dlg-body"></div>
  </dialog>

  <div class="tooltip" id="tooltip" role="tooltip" hidden></div>

  <footer class="foot" id="foot"></footer>
</body>
</html>
